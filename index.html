<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ぽちっとぬりえ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ぽちっとぬりえ">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Yusei Magic (c) The Yusei Magic Project Authors / SIL Open Font License 1.1
   使う文字だけに削ったサブセットを同梱しています。詳しくは OFL.txt          */
@font-face{
  font-family:'Yusei Magic';
  src:url('yuseimagic-subset.woff2') format('woff2');
  font-weight:400; font-style:normal; font-display:swap;
}

:root{
  --maru: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN W4", "Hiragino Sans", sans-serif;
  --pop:  'Yusei Magic', var(--maru);
  --ink:  #3A2E22;
  --pad:  12px;
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{
  width:100%; height:100%; overflow:hidden;
  font-family:var(--pop);
  background:#1a1a1a; color:var(--ink);
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  overscroll-behavior:none; touch-action:none;
}
button{ font-family:inherit; border:none; background:none; cursor:pointer; color:inherit; }

.screen{
  position:fixed; inset:0; display:none;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.screen.on{ display:flex; }

/* =================================================================
   1. タイトル
   ================================================================= */
#titleScreen{
  flex-direction:column; align-items:center; justify-content:space-between;
  background:#87CEEB center/cover no-repeat;
  background-image:url("haikei.svg");
}
#titleScreen::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(180deg, rgba(0,0,0,.30) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,0) 60%, rgba(0,0,0,.35) 100%);
}
.title-wrap{ position:relative; margin-top:3.2vh; text-align:center; }
.app-title{
  font-family:var(--pop);
  font-size: clamp(46px, 10vh, 110px);
  font-weight:400; letter-spacing:.04em;
  color:#FFFFFF;
  -webkit-text-stroke: clamp(9px, 1.7vh, 18px) #23201C;
  paint-order: stroke fill;
  text-shadow: 0 10px 0 rgba(0,0,0,.30);
}
.app-title .c{ display:inline-block; animation: bob 2.4s ease-in-out infinite; }
.app-title .c:nth-child(2n){ animation-delay:.15s }
.app-title .c:nth-child(3n){ animation-delay:.3s }
@keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-8px) } }

.touch-btn{
  position:relative; margin-bottom:5vh;
  display:flex; align-items:center; gap:.35em;
  padding: clamp(16px,2.6vh,30px) clamp(48px,7vw,96px);
  border-radius:999px;
  background:linear-gradient(180deg,#FFE066,#FFB020);
  border:8px solid #23201C;
  box-shadow: 0 10px 0 #B87400, 0 18px 26px rgba(0,0,0,.4);
  font-size: clamp(34px, 6.2vh, 68px); letter-spacing:.1em;
  color:var(--ink);
  animation: pulse 1.5s ease-in-out infinite;
}
.touch-btn:active{ transform:translateY(8px); box-shadow:0 2px 0 #B87400, 0 6px 12px rgba(0,0,0,.4); }
@keyframes pulse{ 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.055) } }

/* こっそりボタン（背景・音） */
.mini{
  position:absolute; z-index:5;
  /* ホーム画面から起動すると画面の上端がステータスバーの下に潜るので、
     その分だけ下げる（ふつうに開いたときは 0 になる）              */
  top: calc(env(safe-area-inset-top) + 10px);
  width:64px; height:64px; border-radius:50%;
  font-size:28px; line-height:60px;
  background:rgba(0,0,0,.34); color:#fff; opacity:.55;
  border:2px solid rgba(255,255,255,.5);
}
#bgBtn{ right: calc(env(safe-area-inset-right) + 12px); }
#sndBtn{ left: calc(env(safe-area-inset-left) + 12px); opacity:.85; }

/* 押したのがわかるように */
.mini:active{ background:rgba(255,255,255,.92); color:#23201C; transform:scale(1.12); opacity:1; }

#bgPanel{
  position:absolute; inset:0; z-index:6; display:none;
  flex-direction:column; align-items:center; justify-content:center; gap:18px;
  background:rgba(0,0,0,.62);
}
#bgPanel.on{ display:flex; }
#bgPanel .ttl{ color:#FFF3D6; font-size:28px; }
#bgPanel button{
  min-width:300px; padding:16px 28px; border-radius:18px;
  border:5px solid #23201C; background:#FFE066; font-size:25px;
}
#bgPanel button.sub{ background:#E8E8E8; }
#bgPanel button.close{ background:#B7E7FF; }

/* =================================================================
   2. えらぶ
   ================================================================= */
#selectScreen{
  flex-direction:column;
  background:radial-gradient(circle at 18% 12%, #FFF9EC 0%, #FFE9C2 45%, #FFD79A 100%);
}
.select-head{
  flex:0 0 auto; text-align:center;
  padding: clamp(6px,1.2vh,16px) 0 clamp(2px,.6vh,8px);
  font-size: clamp(26px,4.4vh,46px); letter-spacing:.06em;
  color:#FFFFFF; -webkit-text-stroke:7px #3A2E22; paint-order: stroke fill;
}
.select-body{ flex:1 1 auto; display:flex; align-items:stretch; gap:clamp(4px,1vw,12px); min-height:0; padding:0 clamp(6px,1.2vw,16px) clamp(8px,1.6vh,18px); }
.page-btn{
  flex:0 0 auto; align-self:center;
  width: clamp(58px,7vw,96px); height: clamp(110px,26vh,220px);
  border-radius:26px; border:6px solid #3A2E22;
  background:linear-gradient(180deg,#B7E7FF,#6FC6F5);
  box-shadow:0 7px 0 rgba(58,46,34,.4);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  transition:transform .08s;
}
.page-btn:active{ transform:translateY(6px); box-shadow:0 1px 0 rgba(58,46,34,.4); }
.page-btn .ar{ font-size: clamp(30px,5vh,52px); line-height:1; }
.grid{
  flex:1 1 auto; display:grid;
  grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(3,1fr);
  gap: clamp(6px,1.3vh,16px); min-height:0; min-width:0;
}
.card{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:#FFFFFF; border:6px solid #3A2E22; border-radius:22px;
  box-shadow:0 7px 0 rgba(58,46,34,.35);
  overflow:hidden; min-height:0; min-width:0; transition:transform .08s;
}
.card:active{ transform:translateY(6px) scale(.97); box-shadow:0 1px 0 rgba(58,46,34,.35); }
.card svg{ flex:1 1 auto; width:100%; height:100%; min-height:0; display:block; }
.card .label{
  flex:0 0 auto; width:100%;
  background:#FFE9B8; border-top:5px solid #3A2E22;
  font-size: clamp(13px,2.3vh,26px); letter-spacing:.02em;
  padding:.2em 0 .3em; white-space:nowrap; overflow:hidden;
}

/* =================================================================
   3. ぬりえ
   ================================================================= */
#paintScreen{ flex-direction:row; background:#FFE9C2; gap:var(--pad); padding:var(--pad); }
.left-col{ flex:1 1 auto; display:flex; flex-direction:column; gap:var(--pad); min-width:0; }
.paper-area{ flex:1 1 auto; display:flex; align-items:center; justify-content:center; min-height:0; min-width:0; }
.paper{
  position:relative; background:#FFFFFF;
  border:6px solid #3A2E22; border-radius:18px;
  box-shadow:0 8px 0 rgba(58,46,34,.28), 0 14px 30px rgba(0,0,0,.15);
  overflow:hidden; touch-action:none;
  isolation:isolate;
}
#paintCanvas{ position:absolute; inset:0; width:100%; height:100%; display:block; z-index:1; }
#lineLayer{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:2; mix-blend-mode:multiply; }

.palette{
  flex:0 0 auto; display:grid;
  grid-template-columns:repeat(10,1fr); grid-template-rows:repeat(2,auto);
  gap: clamp(2px,.5vw,8px) clamp(3px,.6vw,10px);
}
.swatch{
  display:flex; flex-direction:column; align-items:center; gap:1px;
  padding:3px 0 4px; border-radius:14px; transition:transform .08s, background .12s;
}
.swatch .dot{
  width: clamp(28px, 5.4vh, 52px); height: clamp(28px, 5.4vh, 52px);
  border-radius:50%; border:5px solid #3A2E22;
  box-shadow: inset 0 -6px 0 rgba(0,0,0,.16), 0 3px 0 rgba(58,46,34,.3);
}
.swatch .nm{ font-size: clamp(10px,1.85vh,20px); white-space:nowrap; }
.swatch.sel{ background:#3A2E22; }
.swatch.sel .nm{ color:#FFF3D6; }
.swatch.sel .dot{ border-color:#FFF3D6; transform:scale(1.06); }
.swatch:active{ transform:translateY(3px); }

.side{ flex:0 0 auto; width: clamp(132px, 20vw, 218px); display:flex; flex-direction:column; gap:clamp(6px,1vh,12px); }
.btn{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  border:6px solid #3A2E22; border-radius:20px; letter-spacing:.04em;
  box-shadow:0 7px 0 rgba(58,46,34,.4);
  padding: clamp(4px,.9vh,12px) 4px clamp(6px,1.1vh,14px);
  transition:transform .08s;
}
.btn:active{ transform:translateY(6px); box-shadow:0 1px 0 rgba(58,46,34,.4); }
.btn .tx{ font-size: clamp(16px,2.9vh,31px); }

/* クレヨンのふとさ */
.sizes{ flex:0 0 auto; display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(3px,.6vh,8px); }
.size{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  background:#FFFFFF; border:5px solid #3A2E22; border-radius:16px;
  padding:clamp(4px,.8vh,9px) 2px clamp(5px,.9vh,10px);
  box-shadow:0 5px 0 rgba(58,46,34,.35); transition:transform .08s;
}
.size:active{ transform:translateY(4px); box-shadow:0 1px 0 rgba(58,46,34,.35); }
.size .d{ border-radius:50%; background:#3A2E22; }
.size .t{ font-size: clamp(10px,1.8vh,19px); line-height:1; }
.size.sel{ background:#3A2E22; }
.size.sel .t{ color:#FFF3D6; }
.size.sel .d{ background:#FFF3D6; }
#backBtn  { background:linear-gradient(180deg,#B7E7FF,#6FC6F5); }
#clearBtn { background:linear-gradient(180deg,#FFC9C4,#FF8F86); }
#saveBtn  { background:linear-gradient(180deg,#CFF3C9,#8DD48A); }
#eraserBtn{ background:linear-gradient(180deg,#FFFFFF,#E8E8E8); }
#eraserBtn.sel{ background:linear-gradient(180deg,#FFD86B,#FFA91E); transform:translateY(4px); box-shadow:0 2px 0 rgba(58,46,34,.4); }
.ref{
  flex:0 0 auto; background:#FFFFFF; border:6px solid #3A2E22; border-radius:20px;
  padding:5px; display:flex; flex-direction:column; align-items:center;
  box-shadow:0 7px 0 rgba(58,46,34,.28);
}
.ref .cap{ font-size: clamp(11px,2vh,21px); margin-bottom:1px; }
.ref svg{ width:100%; height:auto; display:block; }
.side .spacer{ flex:1 1 auto; min-height:0; }

/* =================================================================
   ダイアログ（ぜんぶけす／ほぞん）
   ================================================================= */
.modal{
  position:fixed; inset:0; z-index:40; display:none;
  flex-direction:column; align-items:center; justify-content:center; gap:20px;
  background:rgba(0,0,0,.66); padding:20px;
}
.modal.on{ display:flex; }
.modal .msg{ color:#FFF3D6; font-size: clamp(20px,3.6vh,34px); text-align:center; line-height:1.5; }
.modal .row{ display:flex; gap:20px; flex-wrap:wrap; justify-content:center; }
.modal .mbtn{
  min-width:200px; padding:14px 30px; border-radius:20px;
  border:6px solid #23201C; font-size: clamp(20px,3.4vh,32px);
  box-shadow:0 6px 0 rgba(0,0,0,.45);
}
.modal .mbtn:active{ transform:translateY(5px); box-shadow:0 1px 0 rgba(0,0,0,.45); }
.mbtn.yes{ background:#FF8F86; }
.mbtn.no { background:#E8E8E8; }
.mbtn.ok { background:#B7E7FF; }
#saveImg{
  max-width:min(78vw, 900px); max-height:56vh;
  border:6px solid #FFF3D6; border-radius:14px; background:#fff;
  -webkit-touch-callout:default; -webkit-user-select:auto; user-select:auto;
}

/* =================================================================
   たてむき
   ================================================================= */
#rotate{
  position:fixed; inset:0; z-index:99; display:none;
  flex-direction:column; align-items:center; justify-content:center; gap:24px;
  background:#2B2B2B; color:#FFF3D6; text-align:center;
  font-size:30px; line-height:1.6;
}
#rotate .ic{ font-size:90px; animation:spin 2.4s ease-in-out infinite; }
@keyframes spin{ 0%,45%{ transform:rotate(0) } 55%,100%{ transform:rotate(-90deg) } }
@media (orientation:portrait){ #rotate{ display:flex; } }
</style>
</head>
<body>

<section id="titleScreen" class="screen on">
  <div class="title-wrap"><h1 class="app-title" id="appTitle"></h1></div>
  <button class="touch-btn" id="touchBtn">タッチ</button>

  <button id="sndBtn" class="mini" aria-label="おと">🔊</button>
  <button id="bgBtn"  class="mini" aria-label="はいけい">⚙</button>
  <div id="bgPanel">
    <div class="ttl">はいけいの がぞう</div>
    <button id="bgPick">がぞうを えらぶ</button>
    <button id="bgReset" class="sub">もとに もどす</button>
    <button id="bgClose" class="close">とじる</button>
  </div>
  <input type="file" id="bgFile" accept="image/*" hidden>
</section>

<section id="selectScreen" class="screen">
  <div class="select-head" id="pageTitle">のりもの</div>
  <div class="select-body">
    <button class="page-btn" id="prevBtn"><span class="ar">◀</span></button>
    <div class="grid" id="grid"></div>
    <button class="page-btn" id="nextBtn"><span class="ar">▶</span></button>
  </div>
</section>

<section id="paintScreen" class="screen">
  <div class="left-col">
    <div class="paper-area">
      <div class="paper" id="paper">
        <canvas id="paintCanvas" width="1600" height="1200"></canvas>
        <img id="lineLayer" alt="">
      </div>
    </div>
    <div class="palette" id="palette"></div>
  </div>
  <div class="side">
    <button class="btn" id="backBtn"><span class="tx">もどる</span></button>
    <div class="ref"><div class="cap">みほん</div><div id="refImg"></div></div>
    <div class="sizes" id="sizes"></div>
    <div class="spacer"></div>
    <button class="btn" id="saveBtn"><span class="tx">ほぞん</span></button>
    <button class="btn" id="clearBtn"><span class="tx">ぜんぶけす</span></button>
    <button class="btn" id="eraserBtn"><span class="tx">けしごむ</span></button>
  </div>
</section>

<div class="modal" id="clearModal">
  <div class="msg">ぜんぶ けしても いい？</div>
  <div class="row">
    <button class="mbtn yes" id="clearYes">けす</button>
    <button class="mbtn no"  id="clearNo">やめる</button>
  </div>
</div>

<div class="modal" id="saveModal">
  <img id="saveImg" alt="">
  <div class="msg" id="saveMsg">えを ながおしして<br>「"写真"に追加」を えらんでね</div>
  <div class="row"><button class="mbtn ok" id="saveClose">とじる</button></div>
</div>

<div class="modal" id="diagModal">
  <div class="msg" id="diagText" style="font-size:20px; text-align:left; line-height:1.8; background:rgba(0,0,0,.72); border:4px solid #FFF3D6; border-radius:16px; padding:20px 28px"></div>
  <div class="row"><button class="mbtn ok" id="diagClose">とじる</button></div>
</div>

<div id="rotate"><div class="ic">📱</div><div>iPadを<br>よこむきに してね</div></div>

<audio id="bgm" loop preload="auto" src="いつもの散歩道.mp3"></audio>

<script src="art.js"></script>
<script src="app.js"></script>
</body>
</html>
